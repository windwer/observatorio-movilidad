name: QA

on:
  push:
  pull_request:

jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar sintaxis Python
        run: python -m compileall -q .
      - name: Validar referencia poblacional Eustat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/references/POBLACION_EUSTAT_2025_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['summary']['total_population'] == 150832
          assert payload['summary']['sections'] == 109
          assert payload['validation']['geometry_joined'] is False
          print('Eustat 2025: 109 secciones, 150832 habitantes; sin afirmar cobertura espacial.')
          PY
