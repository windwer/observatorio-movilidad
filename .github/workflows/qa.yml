name: QA

on:
  push:
  pull_request:

jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Comprobar sintaxis Python
        run: python -m compileall -q .
      - name: Comprobar sintaxis del visor
        run: |
          node --check static/app.js
          node --check static/offline_map.js
      - name: Validar versión y catálogo de líneas
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import app
          import engine

          assert app.version(True)['version'] == '0.6.6'
          path = Path(tempfile.mkstemp(suffix='.sqlite3')[1])
          conn = engine.connect(path)
          conn.execute("INSERT INTO feeds(sha256,operator,snapshot_date,original_name,imported_at,min_date,max_date) VALUES ('qa','ekialdebus','2026-10-01','qa.zip','2026-10-01T00:00:00','2026-10-01','2026-10-31')")
          conn.execute("INSERT INTO routes VALUES (1,'r1','L1','Linea 1')")
          conn.execute("INSERT INTO routes VALUES (1,'r2','L2','Linea 2')")
          conn.commit()
          catalog = engine.route_catalog(conn, 'ekialdebus', 2026, 10)
          assert [row['name'] for row in catalog['routes']] == ['L1', 'L2']
          conn.close()
          path.unlink(missing_ok=True)
          print('v0.6.6 y catálogo de líneas: OK')
          PY
      - name: Validar referencia poblacional Eustat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/references/POBLACION_EUSTAT_2025_v1.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['total_population'] == 150832
          assert payload['sections'] == 109
          assert payload['validation']['spatial_coverage_ready'] is False
          print('Eustat 2025: 109 secciones, 150832 habitantes; sin afirmar cobertura espacial.')
          PY
